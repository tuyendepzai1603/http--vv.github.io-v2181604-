    @media (min-width: 640px) {

  <script src="/_sdk/1a0e63f7a958ec3e.editing_sdk.js" integrity="sha512-lW+iibZ5vXaBl3IQ1K3ooQE1gfdDZxiO+Y7NpWdeypLOwr1WIYo3edm3nu+wyePemyM75tcU3yV7YyImK9wxMQ=="></script>
  <script>
    const appState = {
      records: [],
      selectedMode: "Mã QR",
      initialized: false
    };

    const form = document.getElementById("control-form");
    const saveButton = document.getElementById("save-button");
    const statusEl = document.getElementById("form-status");
    const listEl = document.getElementById("record-list");
    const emptyState = document.getElementById("empty-state");
    const countEl = document.getElementById("record-count");

    function setStatus(message, tone) {
      statusEl.textContent = message;
      statusEl.className = "status-message mt-3 text-center text-xs font-semibold " + (
        tone === "error" ? "text-red-600" : tone === "success" ? "text-emerald-600" : "text-slate-500"
      );
    }

    function formatDate(iso) {
      return new Intl.DateTimeFormat("vi-VN", {
        hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit", year: "numeric"
      }).format(new Date(iso));
    }

    function updateClock() {
      const now = new Date();
      document.getElementById("live-clock").textContent = new Intl.DateTimeFormat("vi-VN", {
        hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
      }).format(now);
      document.getElementById("live-date").textContent = new Intl.DateTimeFormat("vi-VN", {
        weekday: "long", day: "2-digit", month: "2-digit", year: "numeric"
      }).format(now);
    }

    function updateRecordElement(element, record) {
      element.dataset.recordId = record.__backendId;
      element.querySelector(".record-name").textContent = record.ten;
      element.querySelector(".record-id").textContent = "MNV: " + record.ma_nhan_vien;
      element.querySelector(".record-tag").textContent = record.loai_kiem_soat;
      const device = [record.thuong_hieu, record.model, record.mau_dien_thoai].filter(Boolean).join(" · ");
      element.querySelector(".record-device").textContent =
        (device ? device + " — " : "") + (record.muc_dich_su_dung || "Chưa có mục đích");
      element.querySelector(".record-time").textContent = "Kiểm tra: " + formatDate(record.thoi_gian_check);
    }

    function renderRecords(records) {
      appState.records = records.slice().sort((a, b) => new Date(b.thoi_gian_check) - new Date(a.thoi_gian_check));
      countEl.textContent = String(appState.records.length);
      emptyState.classList.toggle("hidden", appState.records.length > 0);

      const existing = new Map([...listEl.children].map((element) => [element.dataset.recordId, element]));
      appState.records.slice(0, 12).forEach((record) => {
        const found = existing.get(record.__backendId);
        if (found) {
          updateRecordElement(found, record);
          existing.delete(record.__backendId);
          return;
        }
        const fragment = document.getElementById("record-template").content.cloneNode(true);
        const element = fragment.querySelector("article");
        updateRecordElement(element, record);
        listEl.appendChild(fragment);
      });
      existing.forEach((element) => element.remove());
    }

    function selectMode(mode) {
      appState.selectedMode = mode;
      const qr = document.getElementById("qr-mode");
      const card = document.getElementById("card-mode");
      const isQr = mode === "Mã QR";
      qr.classList.toggle("is-active", isQr);
      card.classList.toggle("is-active", !isQr);
      qr.setAttribute("aria-pressed", String(isQr));
      card.setAttribute("aria-pressed", String(!isQr));
    }

    document.getElementById("qr-mode").addEventListener("click", () => selectMode("Mã QR"));
    document.getElementById("card-mode").addEventListener("click", () => selectMode("Thẻ kiểm soát"));

    const dataHandler = {
      onDataChanged(data) {
        renderRecords(data);
      }
    };

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!appState.initialized) {
        setStatus("Đang kết nối dữ liệu, vui lòng thử lại trong giây lát.", "error");
        return;
      }
      if (appState.records.length >= 999) {
        setStatus("Đã đạt giới hạn 999 bản ghi. Vui lòng xóa bớt dữ liệu trong Canva Sheet.", "error");
        return;
      }
      if (!form.reportValidity()) return;

      saveButton.disabled = true;
      setStatus("Đang lưu thông tin kiểm soát...", "neutral");

      const formData = new FormData(form);
      const record = {
        ma_nhan_vien: formData.get("ma_nhan_vien").trim(),
        ten: formData.get("ten").trim(),
        muc_dich_su_dung: formData.get("muc_dich_su_dung").trim(),
        thuong_hieu: formData.get("thuong_hieu").trim(),
        model: formData.get("model").trim(),
        mau_dien_thoai: formData.get("mau_dien_thoai").trim(),
        serial_5g: formData.get("serial_5g").trim(),
        khu_vuc_bo_sung: formData.get("khu_vuc_bo_sung").trim(),
        thoi_gian_check: new Date().toISOString(),
        loai_kiem_soat: appState.selectedMode + " · " + formData.get("loai_kiem_soat")
      };

      const result = await window.dataSdk.create(record);
      saveButton.disabled = false;

      if (result.isOk) {
        form.reset();
        setStatus("Đã lưu thông tin kiểm soát thành công.", "success");
      } else {
        setStatus("Không thể lưu bản ghi. Vui lòng kiểm tra lại và thử lại.", "error");
      }
    });

    async function initialize() {
      updateClock();
      setInterval(updateClock, 1000);
      lucide.createIcons();

      const initResult = await window.dataSdk.init(dataHandler);
      if (initResult.isOk) {
        appState.initialized = true;
        setStatus("", "neutral");
      } else {
        setStatus("Không thể kết nối Canva Sheet. Vui lòng tải lại ứng dụng.", "error");
      }
    }

    initialize();
  </script>
