<!DOCTYPE html>

<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Heart Explosion</title>

<style>

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}

body{

    overflow:hidden;

    background:black;

    height:100vh;

}

.center-heart{

    position:absolute;

    top:50%;

    left:50%;

    width:120px;

    height:120px;

    background:red;

    transform:translate(-50%,-50%) rotate(-45deg);

    animation:beat 1s infinite;

    box-shadow:0 0 80px red;

}

.center-heart::before,

.center-heart::after{

    content:"";

    position:absolute;

    width:120px;

    height:120px;

    background:red;

    border-radius:50%;

}

.center-heart::before{

    top:-60px;

    left:0;

}

.center-heart::after{

    left:60px;

    top:0;

}

.particle{

    position:absolute;

    width:25px;

    height:25px;

    background:red;

    transform:rotate(-45deg);

    box-shadow:0 0 20px red;

    animation:explode 3s linear forwards;

}

.particle::before,

.particle::after{

    content:"";

    position:absolute;

    width:25px;

    height:25px;

    background:inherit;

    border-radius:50%;

}

.particle::before{

    top:-12.5px;

    left:0;

}

.particle::after{

    left:12.5px;

    top:0;

}

@keyframes explode{

    0%{

        opacity:1;

        transform:translate(0,0) rotate(-45deg) scale(1);

    }

    100%{

        opacity:0;

        transform:

        translate(var(--x), var(--y))

        rotate(-45deg)

        scale(0);

    }

}

@keyframes beat{

    0%{

        transform:translate(-50%,-50%) rotate(-45deg) scale(1);

    }

    50%{

        transform:translate(-50%,-50%) rotate(-45deg) scale(1.15);

    }

    100%{

        transform:translate(-50%,-50%) rotate(-45deg) scale(1);

    }

}

</style>

</head>

<body>

<div class="center-heart"></div>

<script>

function createParticle(){

    const particle = document.createElement("div");

    particle.classList.add("particle");

    particle.style.left = window.innerWidth / 2 + "px";

    particle.style.top = window.innerHeight / 2 + "px";

    const angle = Math.random() * 2 * Math.PI;

    const distance = Math.random() * 700 + 100;

    const x = Math.cos(angle) * distance + "px";

    const y = Math.sin(angle) * distance + "px";

    particle.style.setProperty('--x', x);

    particle.style.setProperty('--y', y);

    const size = Math.random() * 25 + 10;

    particle.style.width = size + "px";

    particle.style.height = size + "px";

    document.body.appendChild(particle);

    setTimeout(()=>{

        particle.remove();

    },3000);

}

setInterval(()=>{

    for(let i=0;i<8;i++){

        createParticle();

    }

},200);

</script>

</body>

</html>
