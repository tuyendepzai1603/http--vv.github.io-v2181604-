<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
    overflow:hidden;
}

.heart{
    position:relative;
    width:120px;
    height:120px;
    background:red;
    transform:rotate(-45deg);
    animation:beat 1s infinite;
    box-shadow:0 0 50px red;
}

.heart::before,
.heart::after{
    content:"";
    position:absolute;
    width:120px;
    height:120px;
    background:red;
    border-radius:50%;
}

.heart::before{
    top:-60px;
    left:0;
}

.heart::after{
    left:60px;
    top:0;
}

@keyframes beat{
    0%{
        transform:rotate(-45deg) scale(1);
    }
    50%{
        transform:rotate(-45deg) scale(1.1);
    }
    100%{
        transform:rotate(-45deg) scale(1);
    }
}
</style>
</head>

<body>
    <div class="heart"></div>
</body>
</html>
